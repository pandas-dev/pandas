<nav class="bd-links" id="bd-docs-nav" aria-label="Main navigation">
  <div class="bd-toc-item navbar-nav">
    {% if pagename.startswith("reference") %}
    {{ generate_toctree_html("sidebar", maxdepth=4, collapse=True, includehidden=True, titles_only=True) }}
    {% else %}
    {{ generate_toctree_html("sidebar", maxdepth=4, collapse=False, includehidden=True, titles_only=True) }}
    {% endif %}
  </div>
</nav>
<script>
(function () {
  const storageKey = "pandas-docs-sidebar-scroll";

  function getSidebar() {
    return document.getElementById("bd-docs-nav");
  }

  function restoreScroll() {
    const sidebar = getSidebar();
    if (!sidebar) {
      return;
    }

    const position = sessionStorage.getItem(`${storageKey}:${location.pathname}`);
    if (position !== null) {
      sidebar.scrollTop = Number(position);
    }
  }

  function saveScroll() {
    const sidebar = getSidebar();
    if (!sidebar) {
      return;
    }

    sessionStorage.setItem(
      `${storageKey}:${location.pathname}`,
      String(sidebar.scrollTop),
    );
  }

  document.addEventListener("DOMContentLoaded", restoreScroll);
  window.addEventListener("scroll", saveScroll, { passive: true });
  window.addEventListener("pagehide", saveScroll);
})();
</script>
