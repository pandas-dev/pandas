[workspace]
channels = ["conda-forge"]
# pixi's default macOS is too old for psycopg2's Python 3.15 builds (libpq >=18.6 needs macOS >=13.3)
platforms = ["linux-64", "linux-aarch64", { platform = "osx-64", macos = "13.3" }, { platform = "osx-arm64", macos = "13.3" }, "win-64"]
name = "pandas"
requires-pixi = ">=0.82.1"

[dependencies]
# Build dependencies
versioneer = ">=0.29"
cython = ">3.1.0,<4.0.0a0"
meson = ">=1.2.3,<2"
meson-python = ">=0.19.0,<1"
pip = ">=26"
# https://github.com/mesonbuild/meson/issues/15740#issuecomment-5406526307
# maybe removeable once issue is closed
pkg-config = "*"

# Required dependencies
python-dateutil = ">=2.9.0"

[feature.default-compiler.dependencies]
c-compiler = "*"
cxx-compiler = "*"

[feature.numpy.dependencies]
numpy = ">=2.0.2,<3"

[target.win.dependencies]
tzdata = ">=2023.3"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"

[feature.test-base.dependencies]
pytest = ">=8.3.4"
pytest-xdist = ">=3.6.1"
pytest-cov = ">=7.0.0"
# Exercises the tests behind the `ip` fixture in pandas/conftest.py
ipython = "*"

[feature.test-network.dependencies]
pytest-localserver = ">=0.9.0"
boto3 = ">=1.40.46"
botocore = ">=1.40.46"

[feature.test-clipboard]
activation = { env = { QT_QPA_PLATFORM = "offscreen" } }

[feature.test-clipboard.dependencies]
pytest-qt = ">=4.4.0"
pyqt = ">=5.15.11"
qtpy = ">=2.4.3"

[feature.pyarrow.dependencies]
pyarrow = ">=16.0.0"

[feature.optional-dependencies.dependencies]
adbc-driver-postgresql = ">=1.7.0"
adbc-driver-sqlite = ">=1.7.0"
beautifulsoup4 = ">=4.13.4"
blosc = ">=1.21.3"
bottleneck = ">=1.5.0"
fsspec = ">=2025.7.0"
html5lib = ">=1.1"
gcsfs = ">=2025.7.0"
jinja2 = ">=3.1.6"
lxml = ">=6.0.0"
matplotlib = ">=3.10.5"
numba = ">=0.61.2"
# 2.14.1 can silently return incorrect results, GH#65408
numexpr = ">=2.11.0,!=2.14.1"
odfpy = ">=1.4.1"
openpyxl = ">=3.1.5"
psycopg2 = ">=2.9.10"
pymysql = ">=1.1.1"
pyreadstat = ">=1.3.0"
pytables = ">=3.10.2"
python-calamine = ">=0.4.0"
pytz = ">=2020.1"
pyxlsb = ">=1.0.10"
s3fs = ">=2025.7.0"
scipy = ">=1.16.1"
sqlalchemy = ">=2.0.42"
tabulate = ">=0.10.0"
xarray = ">=2025.7.1"
xlrd = ">=2.0.2"
xlsxwriter = ">=3.2.5"
zstandard = ">=0.23.0"

# TODO: Move these back to optional-dependencies once these packages support Python 3.15
[feature.optional-dependencies-no-py315.dependencies]
fastparquet = ">=2024.11.0"
pyiceberg = ">=0.9.1"

# Test latest N releases of pyarrow and numpy across the tested Python versions
# The latest Python release should test the latest pyarrow and numpy version (unpinned)
[environments]
py311 = { features = ["py311", "test-base", "test-clipboard", "test-network", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"], dependencies = { numpy = "2.1.*", pyarrow = "22.*" } }
py312 = { features = ["py312", "test-base", "test-clipboard", "test-network", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"], dependencies = { numpy = "2.2.*", pyarrow = "23.*" } }
py313 = { features = ["py313", "test-base", "test-clipboard", "test-network", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"], dependencies = { numpy = "2.3.*", pyarrow = "24.*" } }
py314 = { features = ["py314", "test-base", "test-clipboard", "test-network", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"], dependencies = { numpy = "2.4.*", pyarrow = "25.*" } }
py315 = { features = ["py315", "numpy", "test-base", "test-network", "pyarrow", "optional-dependencies", "default-compiler"] }
no-pyarrow = { features = ["py313", "numpy", "test-base", "test-clipboard", "test-network", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"] }

[environments.minimum-versions]
features = ["py311", "numpy", "test-base", "test-clipboard", "test-network", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"]
solve-strategy = "lowest-direct"

[environments.minimum-versions.dependencies]
# Avoid <3.11.5, soupsieve>=3.0 (for bs4) uses regex pattern supported by Python 3.11.5
python = ">=3.11.5,<3.12"

[environments.py314-freethreading]
features = ["numpy", "test-base", "default-compiler"]
dependencies = { python-freethreading = "3.14.*" }

[environments.numpy-nightly]
features = ["py313", "test-base", "pyarrow", "default-compiler"]
pypi-dependencies = { numpy = { version = "*", index = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" } }

[environments.pyarrow-nightly]
features = ["py313", "numpy", "test-base", "default-compiler"]
pypi-dependencies = { pyarrow = { version = "*", index = "https://pypi.anaconda.org/scientific-python-nightly-wheels/simple" } }

[environments.downstream]
features = ["py313", "numpy", "test-base", "default-compiler"]

[environments.downstream.dependencies]
cftime = "*"
dask = "*"
seaborn = "*"
scikit-learn = "*"
statsmodels = "*"
pandas-datareader = "*"
pyyaml = "*"
xarray = ">=2025.7.1"

[environments.asv]
features = ["py313", "numpy", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"]

[environments.asv.dependencies]
asv = ">=0.6.6"
py-rattler = "*"  # for environment_type in asv.conf.json

[environments.doctests]
features = ["py313", "numpy", "test-base", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"]

[environments.doctests.dependencies]
pytest-cython = ">=0.4.0"
natsort = "*" # DataFrame.sort_values doctest
tokenize-rt = "*" # scripts/check_for_inconsistent_pandas_namespace.py
pyyaml = "*" # scripts/tests/test_validate_min_versions_in_sync.py

[environments.typing]
features = ["py313", "numpy", "test-base", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"]

[environments.typing.dependencies]
# To avoid pyarrow=24 for typing
pyarrow = "25.*"
pre-commit = ">=4.2.0"
ipython = "*"
mypy = "==2.4.0"
scipy-stubs = "*"
types-python-dateutil = "*"
types-PyMySQL = "*"
types-pytz = "*"
types-PyYAML = "*"

[environments.docs-and-web]
features = ["py312", "numpy", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315", "default-compiler"]

[environments.docs-and-web.dependencies]
gitpython = "*" # obtain contributors from git for whatsnew
ipykernel = "*" # used in doc/source/user_guide/style.ipynb
ipywidgets = "*" # used in doc/source/user_guide/style.ipynb
nbconvert = ">=7.11.0"
nbformat = "*" # used in doc/source/user_guide/style.ipynb
nbsphinx = "*"
numpydoc = "*"
pandoc = "*"
seaborn = "*" # used in doc/source/user_guide/style.ipynb
sphinx = "*"
sphinx-design = ">=0.8.0"
sphinx-autobuild = "*" # live preview of the docs
sphinx-copybutton = "*"
pydata-sphinx-theme = "==0.20.0"
feedparser = "*"
jinja2 = "*"
jupyterlite-core = "*"
jupyterlite-pyodide-kernel = "*"
markdown = "*"
packaging = "*"
pygments = "*" # Code highlighting
pytest = "*"
pyyaml = "*"
requests = "*"

[environments.mingw]
features = ["py313", "numpy", "test-base", "test-clipboard", "test-network", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315"]
platforms = ["win-64"]
activation = { env = { CC = "gcc", CXX = "g++" } }

[environments.mingw.dependencies]
# Pinned due to https://github.com/conda-forge/m2w64-sysroot-feedstock/issues/23
gcc = { version = "==16.1.0", build = "hb5e953d_1" }
gxx = { version = "==16.1.0", build = "h1f05005_1" }
libwinpthread = { version = "==12.0.0.r4.gg4f2fc60ca", build = "h57928b3_10" }
m2w64-sysroot_win-64 = { version = "==12.0.0.r4.gg4f2fc60ca", build = "hd8ed1ab_10" }
mingw-w64-ucrt-x86_64-crt-git = { version = "==12.0.0.r4.gg4f2fc60ca", build = "hd8ed1ab_10" }
mingw-w64-ucrt-x86_64-headers-git = { version = "==12.0.0.r4.gg4f2fc60ca", build = "hd8ed1ab_10" }
mingw-w64-ucrt-x86_64-winpthreads-git = { version = "==12.0.0.r4.gg4f2fc60ca", build = "hd8ed1ab_10" }

[environments.sanitizers]
features = ["py313", "numpy", "test-base", "pyarrow", "optional-dependencies", "optional-dependencies-no-py315"]
platforms = ["linux-64"]
dependencies = { clang = "*", clangxx = "*", compiler-rt = "*" }
activation = { env = { CC = "clang", CXX = "clang++", ASAN_OPTIONS = "detect_leaks=0", UBSAN_OPTIONS = "halt_on_error=1:suppressions=$PIXI_PROJECT_ROOT/ci/suppressions/ubsan.txt" } }


[tasks]
[tasks.uninstall-pandas]
description = "Uninstall pandas from the selected environment"
cmd = "python -m pip uninstall -y pandas || true"

[tasks.build-pandas]
description = "Build pandas in editable mode into the selected environment"
args = [{ arg = "werror", default = "true", choices = ["true", "false"] }]
# py314-freethreading and minimum-versions: Cython <3.2 triggers
#   pyatomic_gcc.h __atomic_fetch_add_8 -Werror=stringop-overflow; remove once Cython >=3.2
cmd = """\
python -m pip install --verbose --editable . --no-build-isolation --no-deps \
--config-settings builddir=build/$PIXI_ENVIRONMENT_NAME \
{% if werror == 'true' and pixi.environment.name not in ['py314-freethreading', 'minimum-versions'] %}-Csetup-args=--werror{% endif %} \
{% if pixi.is_win and pixi.environment.name != 'mingw' %}-Csetup-args=--vsenv{% endif %} \
{% if pixi.environment.name == 'py315' and not pixi.is_win %}-Csetup-args=-Dcpp_args=-Wno-missing-field-initializers{% endif %}"""
depends-on = ["uninstall-pandas"]

[tasks.ci-test-pandas]
description = "Run the pandas test suite as CI does"
# pandas_future sets PANDAS_FUTURE: "default" uses the default value of every
# future config, "legacy" sets configs whose default has changed back to their
# old values, and "upcoming" enables configs whose default has not yet changed.
# Configs whose non-default values do not yet pass the test suite are exempt;
# see _register_future_option in pandas/core/config_init.py.
args = [
  { arg = "marker_expression", default = "not single_cpu" },
  { arg = "numprocesses", default = "auto" },
  { arg = "pytest_target", default = "pandas" },
  { arg = "pandas_future", default = "default", choices = ["default", "legacy", "upcoming"] },
]
env = { PANDAS_FUTURE = "{{ pandas_future }}", PYTHONDEVMODE = "1", PYTHONWARNDEFAULTENCODING = "1", MESONPY_EDITABLE_VERBOSE = "1" }
cmd = [
  "python",
  "-m",
  "pytest",
  "-r",
  "fE",
  "-m",
  "{{ marker_expression }}",
  "--numprocesses={{ numprocesses }}",
  "--dist=worksteal",
  "--capture=no",
  "--cov=pandas",
  "--cov-report=xml",
  "--cov-append",
  "{{ pytest_target }}",
]

[tasks.ci-doctests]
description = "Run the docstring examples as doctests"
# Avoids NumPy scalar reprs in docstrings.
env = { PANDAS_FUTURE_PYTHON_SCALARS = "1" }
cmd = [
  "python",
  "-m",
  "pytest",
  "--doctest-modules",
  "--doctest-cython",
  "--ignore=pandas/tests",
  "pandas",
]
default-environment = "doctests"

[tasks.ci-check-import]
description = "Check that import pandas does not import optional dependencies"
cmd = [
  "python",
  "-W",
  "error",
  "ci/import_pandas_check.py",
]

[tasks.ci-typing]
description = "Run the type checkers (manual stage pre-commit hooks)"
cmd = [
  "pre-commit",
  "run",
  "--verbose",
  "--hook-stage",
  "manual",
  "--all-files",
]
default-environment = "typing"

[tasks.ci-scripts-tests]
description = "Run the tests of the scripts directory"
cmd = [
  "python",
  "-m",
  "pytest",
  "scripts",
]
default-environment = "doctests"

[tasks.ci-asv]
description = "Run each ASV benchmark once to check that it works"
cwd = "asv_bench"
cmd = [
  "python",
  "-m",
  "asv",
  "machine",
  "--yes",
  "&&",
  "python",
  "-W",
  "error",
  "-m",
  "asv",
  "run",
  "--quick",
  "--dry-run",
  # Fork server imports pandas once instead of re-importing it per
  # benchmark; asv >=0.6.6 defaults to "spawn" which does not (GH#66193).
  "--launch-method=forkserver",
  "--durations=30",
  "--python=same",
  "--show-stderr",
]
default-environment = "asv"

[tasks.ci-test-single-page-doc]
description = "Build one documentation page with warnings as errors"
args = [
  { "arg" = "page_to_build" }
]
cmd = [
  "python",
  "doc/make.py",
  "--warnings-are-errors",
  "--no-browser",
  "--single",
  "{{ page_to_build }}",
  "&&",
  "python",
  "doc/make.py",
  "clean",
]
default-environment = "docs-and-web"

[tasks.ci-test-nbconvert-doc-notebooks]
description = "Execute the notebooks in the documentation"
cmd = [
  "python",
  "-m",
  "jupyter",
  "nbconvert",
  "--execute",
  "doc/source/**/*.ipynb",
  "--to",
  "notebook",
  "--stdout",
  ">",
  "/dev/null",
]
default-environment = "docs-and-web"

[tasks.ci-build-documentation]
description = "Build the documentation with warnings as errors"
args = [
  { "arg" = "doc_type", "choices" = ["html", "zip_html"] }
]
cmd = [
  "python",
  "doc/make.py",
  "--warnings-are-errors",
  "{{ doc_type }}",
]
default-environment = "docs-and-web"

[tasks.ci-test-website]
description = "Run the tests of the website"
cmd = [
  "python",
  "-m",
  "pytest",
  "web",
]
default-environment = "docs-and-web"

[tasks.ci-build-website]
description = "Build the website into web/build"
cmd = [
  "python",
  "web/pandas_web.py",
  "web/pandas",
  "--target-path=web/build",
]
default-environment = "docs-and-web"

[tasks.ci-build-interactive_terminal]
description = "Build the JupyterLite interactive terminal of the website"
cmd = [
  "python",
  "-m",
  "jupyter",
  "lite",
  "build",
]
cwd = "web/interactive_terminal/"
default-environment = "docs-and-web"

[tasks.preview-docs]
# Extra arguments are passed to doc/make.py, e.g. --no-api
cmd = [
  "python",
  "doc/make.py",
  "livehtml",
]
default-environment = "docs-and-web"
