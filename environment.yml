# Local development dependencies including docs building, website upload, ASV benchmark
name: pandas-dev
channels:
  - mamba-forge
dependencies:
  - python=3.11
  - pip

  # build dependencies
  - versioneer
  - cython>=3.1.0,<4
  - meson>=1.2.3,<2
  - meson-python>=0.18.0,<1

  # test dependencies
  - pytest>=8.3.4
  - pytest-cov
  - pytest-xdist>=3.6.1
  - pytest-qt>=4.4.0
  - pytest-localserver
  - pyqt>=5.15.11
  - coverage

  # required dependencies
  - python-dateutil
  - numpy<3

  # optional dependencies
  - adbc-driver-postgresql>=1.7.0
  - adbc-driver-sqlite>=1.7.0
  - beautifulsoup4>=4.13.4
  - bottleneck>=1.5.0
  - fastparquet>=2024.11.0
  - fsspec>=2025.7.0
  - html5lib>=1.1
  - gcsfs>=2025.7.0
  - jinja2>=3.1.6
  - lxml>=6.0.0
  - matplotlib>=3.10.5
  - numba>=0.61.2
  - numexpr>=2.11.0
  - openpyxl>=3.1.5
  - odfpy>=1.4.1
  - psycopg2>=2.9.10
  # TMP avoid pyarrow 24.0 due to typing issues (https://github.com/apache/arrow/issues/49831)
  - pyarrow>=16.0.0,!=24.*
  - pyiceberg>=0.9.1
  - pymysql>=1.1.1
  - pyreadstat>=1.3.0
  - pytables>=3.10.2
  - python-calamine>=0.4.0
  - pytz>=2020.1
  - pyxlsb>=1.0.10
  - s3fs>=2025.7.0
  - scipy>=1.16.1
  - sqlalchemy>=2.0.42
  - tabulate>=0.9.0
  - xarray>=2025.7.1
  - xlrd>=2.0.2
  - xlsxwriter>=3.2.5
  - zstandard>=0.23.0

  # downstream packages
  - dask-core
  - seaborn-base
  - ipython

  # Mocking s3 tests
  - moto

  # benchmarks
  - asv>=0.6.6
  - py-rattler

  ## The compiler packages are meta-packages and install the correct compiler (activation) packages on the respective platforms.
  - c-compiler
  - cxx-compiler

  # code checks
  - mypy=2.1.0  # pre-commit uses locally installed mypy
  - tokenize-rt  # scripts/check_for_inconsistent_pandas_namespace.py
  - pre-commit>=4.2.0

  # documentation
  - gitpython  # obtain contributors from git for whatsnew
  - natsort  # DataFrame.sort_values doctest
  - pickleshare  # Needed for IPython Sphinx directive in the docs GH#60429
  - numpydoc
  - pydata-sphinx-theme=0.20.0
  - pytest-cython>=0.4.0  # doctest
  - sphinx
  - sphinx-design
  - sphinx-copybutton

  # static typing
  - scipy-stubs
  - types-python-dateutil
  - types-pymysql
  - types-pytz
  - types-pyyaml

  # documentation (jupyter notebooks)
  - nbconvert>=7.11.0
  - nbsphinx
  - pandoc
  - ipywidgets
  - nbformat
  - notebook>=7.0.6
  - ipykernel

  # web
  # - jinja2  # already listed in optional dependencies, but documented here for reference
  - markdown
  - feedparser
  - pyyaml
  - requests
  - pygments # Code highlighting

  # web interactive REPL
  # see the following links for more context:
  # 1. https://jupyterlite-pyodide-kernel.readthedocs.io/en/stable/#compatibility
  # 2. https://pyodide.org/en/stable/usage/packages-in-pyodide.html
  - jupyterlite-core
  - jupyterlite-pyodide-kernel

  - pip:
      - tzdata>=2023.3
