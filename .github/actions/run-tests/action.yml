name: Run tests and report results
description: Run pytest and upload the results to Codecov
inputs:
  environment:
    description: Virtual environment in pixi.toml to run tests.
    required: true
  numprocesses:
    description: pytest-xdist numprocesses value
    required: true
  pytest_marker_expression:
    description: pytest marker expression to pass to -m.
    required: true
  pytest_target:
    description: File or directory path to run tests
    required: true
  pandas_future:
    description: >-
      Value for the PANDAS_FUTURE environment variable. "default" uses the
      default value of every future config, "legacy" sets configs whose
      default has changed back to their old values, and "upcoming" enables
      configs whose default has not yet changed. Configs whose non-default
      values do not yet pass the test suite are exempt; see
      _register_future_option in pandas/core/config_init.py.
    default: 'default'
runs:
  using: composite
  steps:
    - name: Test
      env:
        PANDAS_FUTURE: ${{ inputs.pandas_future }}
        MESONPY_EDITABLE_VERBOSE: 1
        PYTHONDEVMODE: 1
        PYTHONWARNDEFAULTENCODING: 1
        # Clipboard tests
        QT_QPA_PLATFORM: offscreen
      run: |
        pixi run \
          --environment ${{ inputs.environment }} \
          ci-test-pandas \
          '-m ${{ inputs.pytest_marker_expression }}' \
          ${{ inputs.numprocesses }} \
          ${{ inputs.pytest_target }}
      shell: bash -euox pipefail {0}
