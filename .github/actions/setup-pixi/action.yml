name: Set up Conda environment with Pixi
description: Create a Conda environment based on the environments section in pixi.toml
inputs:
  environment:
    description: Pixi environment name in pixi.toml to use. Required if run-install is true.
    default: ''
  run-install:
    description: Whether to install the environment. If false, only install Pixi.
    default: 'true'
  pixi-version:
    description: Pixi version to install.
    default: v0.85.0
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.environment || 'Pixi' }}
      uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
      with:
        pixi-version: ${{ inputs.pixi-version }}
        log-level: vv
        manifest-path: pixi.toml
        environments: ${{ inputs.run-install == 'true' && inputs.environment != 'pyarrow-nightly' && inputs.environment || '' }}
        run-install: ${{ inputs.run-install == 'true' && inputs.environment != 'pyarrow-nightly' }}
        cache: ${{ inputs.run-install == 'true' && inputs.environment != 'pyarrow-nightly' }}
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

    - name: Install PyArrow Nightly
      if: ${{ inputs.run-install == 'true' && inputs.environment == 'pyarrow-nightly' }}
      shell: bash -euox pipefail {0}
      run: |
        pixi update -e pyarrow-nightly pyarrow
        pixi install -e pyarrow-nightly
