name: Set up Conda environment with Pixi
description: Create a Conda environment based on the environments section in pixi.toml
inputs:
  environment:
    description: Pixi environment name in pyproject.toml to use.
    required: true
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.environment }}
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.76.2
        log-level: vv
        manifest-path: pixi.toml
        environments: ${{ inputs.environment }}
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      if: ${{ !endsWith(inputs.environment, '-nightly') }}

    - name: Install Pixi
      uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.76.2
        log-level: vv
        manifest-path: pixi.toml
        run-install: false
        cache: false
      if: ${{ endsWith(inputs.environment, '-nightly') }}

    # setup-pixi caches the installed env under a pixi.lock-derived key, so
    # letting it install would replay one frozen nightly until the weekly
    # relock. Install by hand instead: `pixi update` for indexes that bump
    # the version, a fresh fetch for those that overwrite a wheel in place.
    - name: Install ${{ inputs.environment }}
      if: ${{ endsWith(inputs.environment, '-nightly') }}
      shell: bash -euox pipefail {0}
      env:
        NIGHTLY_ENV: ${{ inputs.environment }}
      run: |
        pixi update -e "$NIGHTLY_ENV" "${NIGHTLY_ENV%-nightly}"
        pixi install -e "$NIGHTLY_ENV"
        # setup-pixi only runs this itself when it does the install
        pixi list -e "$NIGHTLY_ENV"
