version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/setup-pixi"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels:
      - "CI"
      - "Dependencies"
    groups:
      # init/autobuild/analyze must stay on the same version or CodeQL errors out
      codeql-action:
        patterns:
          - "github/codeql-action*"
