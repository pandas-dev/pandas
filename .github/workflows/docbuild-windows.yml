name: Doc Build Windows

# Builds a single page on Windows to catch platform-specific errors in the
# doc build configuration, see GH#26574
on:
  push:
    branches:
      - main
      - 3.0.x
    paths:
      - "doc/make.py"
      - "doc/source/conf.py"
      - "doc/source/index.rst.template"
      - "doc/sphinxext/**"
      - ".github/workflows/docbuild-windows.yml"
  pull_request:
    branches:
      - main
      - 3.0.x
    paths:
      - "doc/make.py"
      - "doc/source/conf.py"
      - "doc/source/index.rst.template"
      - "doc/sphinxext/**"
      - ".github/workflows/docbuild-windows.yml"
  workflow_dispatch:

defaults:
  run:
    shell: bash -euox pipefail {0}

permissions: {}

jobs:
  single_page_doc:
    name: Doc Build Single Page (Windows)
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 60

    concurrency:
      # https://github.community/t/concurrecy-not-work-for-push/183068/7
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-web-docs-windows
      cancel-in-progress: true

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Create virtual environment with Pixi
      uses: ./.github/actions/setup-pixi
      with:
        environment: docs-and-web

    - name: Remove link.EXE for Windows
      # https://github.com/Quansight-Labs/uarray/pull/310#issuecomment-3872989816
      run: rm /c/Program\ Files/Git/usr/bin/link.EXE

    - name: Build pandas
      run: |
        pixi run \
          --environment docs-and-web \
          build-pandas \
          --editable \
          "-Csetup-args=--vsenv -Csetup-args=--werror"

    - name: Test build single page doc
      # A page in a subdirectory that renders the {{ header }} ipython block
      run: |
        pixi run \
          ci-test-single-page-doc development/internals.rst
