# Workflow to build wheels for upload to PyPI.
# Inspired by numpy's cibuildwheel config https://github.com/numpy/numpy/blob/main/.github/workflows/wheels.yml
#
# In an attempt to save CI resources, wheel builds do
# not run on each push but only weekly and for releases.
# Wheel builds can be triggered from the Actions page
# (if you have the permissions) on a commit to main.
#
# Alternatively, you can add labels to the pull request in order to trigger wheel
# builds.
# The label(s) that trigger builds are:
# - Build
name: Wheel builder

on:
  release:
    types: [published]
  schedule:
  # 3:27 UTC every day
  - cron: "27 3 * * *"
  push:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths-ignore:
      - "doc/**"
      - "web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash -euxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_sdist:
    name: Build sdist
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'Build')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pandas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Check sdist
        run: ls -l --human-readable ./dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: ./dist/*

  build_wheels:
    needs: build_sdist
    permissions:
      contents: read
    name: Build wheel for ${{ matrix.python }}-${{ matrix.buildplat[1] }}
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'Build')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ubuntu-24.04, manylinux_x86_64]
          - [ubuntu-24.04, musllinux_x86_64]
          - [ubuntu-24.04-arm, manylinux_aarch64]
          - [ubuntu-24.04-arm, musllinux_aarch64]
          - [macos-15-intel, macosx_x86_64]
          - [macos-15, macosx_arm64]
          - [windows-2025, win_amd64]
          - [windows-11-arm, win_arm64]
        python: ["cp311", "cp312", "cp313", "cp314", "cp314t", "cp315", "cp315t"]
        include:
          - buildplat: [ubuntu-24.04, pyodide_wasm32]
            python: cp312

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdist
          path: ./dist

      - name: Save sdist name to environment variable
        run: echo "sdist_name=$(ls ./dist)" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: ./dist/${{ env.sdist_name }}
          only: ${{ matrix.python }}-${{ matrix.buildplat[1] }}

      - name: Set up Python for validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install wheel
        run: python -m pip install wheel

      - name: Validate wheel RECORD
        run: for whl in $(ls wheelhouse); do wheel unpack wheelhouse/$whl -d /tmp; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  upload_nightly:
    # trigger an upload to https://anaconda.org/scientific-python-nightly-wheels/pandas
    # for cron jobs or "Run workflow" (restricted to main branch).
    name: Upload nightly packages to Anaconda
    permissions:
      contents: read
    if: >
      github.repository == 'pandas-dev/pandas' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload wheels & sdist
        uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{secrets.PANDAS_NIGHTLY_UPLOAD_TOKEN}}

  report_failure:
    # Keep one open issue while nightly builds fail, closed by the next passing
    # night. It opens only on a second consecutive failure, to skip flakes. GH#55903
    name: Report nightly build failures
    permissions:
      actions: read           # download the failed jobs' logs
      issues: write           # open, comment on, and close the tracking issue
    if: >-
      !cancelled() &&
      github.repository == 'pandas-dev/pandas' &&
      github.event_name == 'schedule'
    needs:
      - build_sdist
      - build_wheels
      - upload_nightly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        with:
          script: |
            const TITLE = 'CI: Nightly wheel builds are failing';
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', creator: 'github-actions[bot]', per_page: 100,
            });
            const issue = openIssues.find(item => !item.pull_request && item.title === TITLE);

            if (process.env.FAILED !== 'true') {
              if (issue) {
                await github.rest.issues.createComment({
                  ...repo, issue_number: issue.number, body: `Passing again as of ${runUrl}`,
                });
                await github.rest.issues.update({
                  ...repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
                });
              }
              return;
            }

            // This run is still in progress, so the latest completed one is the previous night.
            const { data: { workflow_runs: [previous] } } = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'wheels.yml', event: 'schedule', status: 'completed', per_page: 1,
            });
            if (!issue && previous?.conclusion !== 'failure') {
              core.info('First failing night; waiting for another before opening an issue.');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: context.runId, per_page: 100,
            });
            const failedJobs = jobs
              .filter(job => job.conclusion === 'failure')
              .map(job => ({ id: job.id, name: job.name.replace(/^Build wheel for /, '') }));
            // pytest's short summary lines (ERROR covers collection and fixture errors), e.g.
            // "<timestamp> FAILED ..\venv\Lib\site-packages\pandas\tests\x.py::test_y[z] - Error"
            const failedTest = /^\S+ (?:FAILED|ERROR) (.+?)(?: - .*)?\r?$/gm;
            const failingJobsByTest = new Map();
            for (const job of failedJobs) {
              let log;
              try {
                ({ data: log } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                  ...repo, job_id: job.id,
                }));
              } catch (err) {
                core.warning(`Could not download the log of ${job.name}: ${err}`);
                continue;
              }
              log = typeof log === 'string' ? log : Buffer.from(log).toString();
              for (const [, testId] of log.matchAll(failedTest)) {
                const [path, ...rest] = testId.split('::');
                const key = [path.replace(/\\/g, '/').replace(/^.*?(?=pandas\/tests\/)/, ''), ...rest].join('::');
                failingJobsByTest.set(key, [...(failingJobsByTest.get(key) ?? []), job.name]);
              }
            }

            const lines = [
              `Failing run: ${runUrl}`,
              '',
              `Failing jobs (${failedJobs.length}): ${failedJobs.map(job => job.name).join(', ')}`,
              '',
            ];
            if (failingJobsByTest.size === 0) {
              lines.push('No pytest failures found in the job logs; see the run for the failing step.');
            } else {
              lines.push('Failing tests:');
              for (const [testId, names] of [...failingJobsByTest].slice(0, 50)) {
                const where = names.length === failedJobs.length ? 'all failing jobs' : names.join(', ');
                lines.push(`- \`${testId}\` (${where})`);
              }
              if (failingJobsByTest.size > 50) {
                lines.push(`- ... and ${failingJobsByTest.size - 50} more`);
              }
            }
            const report = lines.join('\n');

            if (issue) {
              await github.rest.issues.createComment({ ...repo, issue_number: issue.number, body: report });
            } else {
              await github.rest.issues.create({
                ...repo,
                title: TITLE,
                labels: ['CI'],
                body: [
                  'The scheduled wheel build has failed on consecutive nights, so no nightly',
                  'wheels were uploaded. This issue is managed by the `report_failure` job in',
                  '`.github/workflows/wheels.yml` and closes on the next passing night.',
                  'Closing it by hand while builds still fail opens a new one on the next failing night.',
                  '',
                  `Previous failing run: ${previous.html_url}`,
                  report,
                ].join('\n'),
              });
            }

  publish:
    if: >
      github.repository == 'pandas-dev/pandas' &&
      github.event_name == 'release' &&
      startsWith(github.ref, 'refs/tags/v')

    needs:
      - build_sdist
      - build_wheels

    runs-on: ubuntu-24.04

    environment:
      name: pypi
    permissions:
      id-token: write         # OIDC for Trusted Publishing
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist          # everything lands in ./dist/**

      # TODO: This step can be probably be achieved by actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      # by specifying merge-multiple: true, and a glob pattern
      - name: Collect files
        run: |
          mkdir -p upload
          # skip any wheel that contains 'pyodide'
          find dist -name '*pyodide*.whl' -prune -o \
                    -name '*.whl'   -exec mv {} upload/ \;
          find dist -name '*.tar.gz' -exec mv {} upload/ \;

      - name: Publish to **PyPI** (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload
          skip-existing: true
