# Workflow to build wheels for upload to PyPI.
# Inspired by numpy's cibuildwheel config https://github.com/numpy/numpy/blob/main/.github/workflows/wheels.yml
#
# In an attempt to save CI resources, wheel builds do
# not run on each push but only weekly and for releases.
# Wheel builds can be triggered from the Actions page
# (if you have the permissions) on a commit to main.
#
# Alternatively, you can add labels to the pull request in order to trigger wheel
# builds.
# The label(s) that trigger builds are:
# - Build
name: Wheel builder

on:
  release:
    types: [published]
  schedule:
  # 3:27 UTC every day
  - cron: "27 3 * * *"
  push:
  pull_request:
    types: [labeled, opened, synchronize, reopened]
    paths-ignore:
      - "doc/**"
      - "web/**"
  workflow_dispatch:

defaults:
  run:
    shell: bash -euxo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build_sdist:
    name: Build sdist
    permissions:
      contents: read
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'Build')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pandas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install build
        run: python -m pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Check sdist
        run: ls -l --human-readable ./dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: ./dist/*

  build_wheels:
    needs: build_sdist
    permissions:
      contents: read
    name: Build wheel for ${{ matrix.python }}-${{ matrix.buildplat[1] }}
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'Build')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ubuntu-24.04, manylinux_x86_64]
          - [ubuntu-24.04, musllinux_x86_64]
          - [ubuntu-24.04-arm, manylinux_aarch64]
          - [ubuntu-24.04-arm, musllinux_aarch64]
          - [macos-15-intel, macosx_x86_64]
          - [macos-15, macosx_arm64]
          - [windows-2025, win_amd64]
          - [windows-11-arm, win_arm64]
        python: ["cp311", "cp312", "cp313", "cp314", "cp314t", "cp315", "cp315t"]
        include:
          - buildplat: [ubuntu-24.04, pyodide_wasm32]
            python: cp312

    steps:
      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sdist
          path: ./dist

      - name: Save sdist name to environment variable
        run: echo "sdist_name=$(ls ./dist)" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: ./dist/${{ env.sdist_name }}
          only: ${{ matrix.python }}-${{ matrix.buildplat[1] }}

      - name: Set up Python for validation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install wheel
        run: python -m pip install wheel

      - name: Validate wheel RECORD
        run: for whl in $(ls wheelhouse); do wheel unpack wheelhouse/$whl -d /tmp; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.python }}-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  upload_nightly:
    # trigger an upload to https://anaconda.org/scientific-python-nightly-wheels/pandas
    # for cron jobs or "Run workflow" (restricted to main branch).
    name: Upload nightly packages to Anaconda
    permissions:
      contents: read
    if: >
      github.repository == 'pandas-dev/pandas' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs:
      - build_sdist
      - build_wheels
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload wheels & sdist
        uses: scientific-python/upload-nightly-action@16fa02eacee1655195143de09f03676e60ef2bf5 # 0.6.5
        with:
          artifacts_path: dist
          anaconda_nightly_upload_token: ${{secrets.PANDAS_NIGHTLY_UPLOAD_TOKEN}}

  stubs_tests:
    # run the pandas-stubs tests (which error on warnings) against the nightly wheel;
    # on failure, open or update a single issue here. See GH#54095.
    name: pandas-stubs tests against pandas nightly
    # !cancelled(): an unrelated failed build_wheels leg would otherwise skip this job.
    # Manual runs are allowed on any branch of a fork, for testing this job.
    if: >
      !cancelled() &&
      ((github.event_name == 'schedule' && github.repository == 'pandas-dev/pandas') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.repository != 'pandas-dev/pandas' || github.ref == 'refs/heads/main')))
    needs: build_wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # open/update the failure issue
    env:
      ISSUE_TITLE: "CI: pandas-stubs tests fail against pandas nightly"
      STUBS_TEAM: "@pandas-dev/pandas-stubs-team"
    steps:
      - name: Checkout pandas-stubs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pandas-dev/pandas-stubs
          persist-credentials: false

      - name: Download pandas wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cp314-manylinux_x86_64
          path: ${{ runner.temp }}/pandas-wheel

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pandas-stubs test dependencies
        run: |
          python -m pip install poetry
          poetry install --no-root
          poetry run python -m pip install pytest-reportlog

      - name: Install pandas wheel
        env:
          WHEEL_DIR: ${{ runner.temp }}/pandas-wheel
        run: |
          poetry run python -m pip install "$WHEEL_DIR"/*.whl
          poetry run python -c "import pandas; print(pandas.__version__)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run pandas-stubs tests
        id: tests
        run: poetry run pytest --report-log=pytest-log.jsonl

      - name: Open or update issue on failure
        id: issue
        if: failure() && steps.tests.outcome == 'failure'
        uses: scientific-python/issue-from-pytest-log-action@35b4e0a9e06f8e7e261778289cf4b968b722662d # v1.6.2
        with:
          log-path: pytest-log.jsonl
          issue-title: ${{ env.ISSUE_TITLE }}
          issue-label: "CI,Typing"

      # the action only edits the body of an existing issue, so ping once per issue
      - name: Ping pandas-stubs team on a new issue
        if: failure() && steps.issue.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(
            gh api "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&labels=CI,Typing&per_page=100" \
              | jq -r --arg title "$ISSUE_TITLE" 'map(select(.title == $title))[0].number'
          )
          if ! gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments" --jq ".[].body" \
              | grep -F "$STUBS_TEAM" > /dev/null; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "$STUBS_TEAM the pandas-stubs tests are failing against pandas nightly."
          fi

  publish:
    if: >
      github.repository == 'pandas-dev/pandas' &&
      github.event_name == 'release' &&
      startsWith(github.ref, 'refs/tags/v')

    needs:
      - build_sdist
      - build_wheels

    runs-on: ubuntu-24.04

    environment:
      name: pypi
    permissions:
      id-token: write         # OIDC for Trusted Publishing
      contents: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist          # everything lands in ./dist/**

      # TODO: This step can be probably be achieved by actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      # by specifying merge-multiple: true, and a glob pattern
      - name: Collect files
        run: |
          mkdir -p upload
          # skip any wheel that contains 'pyodide'
          find dist -name '*pyodide*.whl' -prune -o \
                    -name '*.whl'   -exec mv {} upload/ \;
          find dist -name '*.tar.gz' -exec mv {} upload/ \;

      - name: Publish to **PyPI** (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: upload
          skip-existing: true
